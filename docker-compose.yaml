version: "3.8"

services:
  postgres:
    image: postgres:17
    container_name: beermap-postgres-v2
    restart: unless-stopped

    environment:
      POSTGRES_DB: beermap
      POSTGRES_USER: beermap
      POSTGRES_PASSWORD: beermap

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: